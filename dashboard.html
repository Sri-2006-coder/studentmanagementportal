<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

<h2>Student Dashboard</h2>

<div class="row">

<div class="col-md-3">
<div class="card bg-primary text-white">
<div class="card-body">
Total Students: 500
</div>
</div>
</div>

<div class="col-md-3">
<div class="card bg-success text-white">
<div class="card-body">
Present: 450
</div>
</div>
</div>

<div class="col-md-3">
<div class="card bg-danger text-white">
<div class="card-body">
Absent: 50
</div>
</div>
</div>

<div class="col-md-3">
<div class="card bg-warning">
<div class="card-body">
Placements: 120
</div>
</div>
</div>

</div>

<input type="text" class="form-control my-3" placeholder="Search Student">

<table class="table table-bordered">

<tr>
<th>Roll No</th>
<th>Name</th>
<th>Branch</th>
<th>Attendance</th>
</tr>

<tr>
<td>101</td>
<td>Rahul</td>
<td>CSE</td>
<td><span class="badge bg-success">90%</span></td>
</tr>

<tr>
<td>102</td>
<td>Priya</td>
<td>ECE</td>
<td><span class="badge bg-danger">70%</span></td>
</tr>
</table>
</div>
</body>
</html>
