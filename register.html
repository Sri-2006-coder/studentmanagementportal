<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 style="color: blue">Student Registration Form</h2>

    <form id="registrationForm">

        <div class="mb-3">
            <label>Full Name</label>
            <input type="text" id="fullname" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Roll Number</label>
            <input type="text" id="rollno" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" id="email" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Mobile Number</label>
            <input type="tel" id="mobile" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Gender</label>
            <select id="gender" class="form-select">
                <option>Male</option>
                <option>Female</option>
            </select>
        </div>

        <div class="mb-3">
            <label>Branch</label>
            <select id="branch" class="form-select">
                <option>CSE</option>
                <option>ECE</option>
                <option>EEE</option>
            </select>
        </div>

        <div class="mb-3">
            <label>Date of Birth</label>
            <input type="date" id="dob" class="form-control">
        </div>

        <div class="mb-3">
            <label>Address</label>
            <textarea id="address" class="form-control"></textarea>
        </div>

        <div class="mb-3">
            <label>Upload Photo</label>
            <input type="file" id="photo" class="form-control">
        </div>

        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="terms" required>
            <label class="form-check-label">
                Accept Terms & Conditions
            </label>
        </div>

        <button type="submit" class="btn btn-primary mt-3">Submit</button>

    </form>

</div>

<script>
document.getElementById("registrationForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const student = {
        fullname: document.getElementById("fullname").value,
        rollno: document.getElementById("rollno").value,
        email: document.getElementById("email").value,
        mobile: document.getElementById("mobile").value,
        gender: document.getElementById("gender").value,
        branch: document.getElementById("branch").value,
        dob: document.getElementById("dob").value,
        address: document.getElementById("address").value
    };

    
    localStorage.setItem("studentData", JSON.stringify(student));

    alert("Registration Successful! Data saved in Local Storage.");

    document.getElementById("registrationForm").reset();
});
</script>

</body>
</html>
